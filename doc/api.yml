        totalSold: 8
        publisher:
          id: 11111111-1111-1111-1111-111111111003
          name: Editions Jeunes Malgaches
          country: Madagascar

    ReviewCreateRequest:
      type: object
      required: [rating, userId]
      properties:
        rating:
          type: integer
          minimum: 1
          maximum: 5
        comment:
          type: string
          maxLength: 2000
        userId:
          type: string
          format: uuid
      example:
        rating: 5
        comment: "Chef-d'oeuvre de la littérature française."
        userId: 99999999-9999-9999-9999-999999999001

    ReviewResponse:
      type: object
