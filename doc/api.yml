        comment:
          type: string
        createdAt:
          type: string
          format: date-time
          readOnly: true
        userId:
          type: string
          format: uuid
          readOnly: true
      example:
        id: 77777777-7777-7777-7777-777777777001
        rating: 5
        comment: "Un roman bouleversant sur l'histoire de Madagascar, à lire absolument."
        createdAt: "2025-02-14T10:30:00Z"
        userId: 99999999-9999-9999-9999-999999999001

    StockResponse:
      type: object
      properties:
        editionId:
          type: string
          format: uuid
        isbn:
          type: string
        quantityInStock:
          type: integer
      example:
        editionId: 55555555-5555-5555-5555-555555555001
        isbn: "978-2-84487-000-1"
        quantityInStock: 12

    ArrivalItemRequest:
      type: object
