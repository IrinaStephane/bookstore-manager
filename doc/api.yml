          maxLength: 500
        condition:
          $ref: '#/components/schemas/BookCondition'
        quantityInStock:
          type: integer
        publisherId:
          type: string
          format: uuid
      example:
        isbn: "978-2-84487-000-1"
        format: PAPERBACK
        sellingPrice: 32000
        publishedDate: "2015-03-10"
