openapi: 3.0.3
info:
  title: Library Book API
  description: |
    REST API for the Library Management System.
    Covers full CRUD operations for Books, Authors, Genres, Publishers, Reviews,
    and Book Editions, along with Arrival (stock-in) and Sale (stock-out) operations
    with automatic price history tracking and revenue reporting by genre.

    **Stack:** Spring Boot · Java · Lombok
  version: 1.0.0
  contact:
    name: Library Dev Team

servers:
  - url: http://localhost:8080
    description: Local development server

tags:
  - name: Books
    description: CRUD operations on Book
  - name: Authors
    description: CRUD operations on Author
  - name: Genres
    description: CRUD operations on Genre
  - name: Publishers
    description: CRUD operations on Publisher
  - name: BookEditions
    description: CRUD operations on Book Edition
  - name: Reviews
    description: CRUD operations on Review
  - name: Stock
    description: Stock query and manual adjustment
  - name: Arrivals
    description: Stock-in (increments quantityInStock and totalReceived)
  - name: Sales
    description: Stock-out (decrements quantityInStock and increments totalSold)
  - name: Revenue
    description: Revenue reporting grouped by genre

paths:

  /books:
    get:
      tags: [Books]
      summary: List all books (paginated, filterable)
      operationId: getAllBooks
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
        - name: language
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/Language'
          example: FR
        - name: genreId
          in: query
          required: false
          schema:
            type: string
            format: uuid
          example: 33333333-3333-3333-3333-333333333001
        - name: authorId
          in: query
          required: false
          schema:
            type: string
            format: uuid
          example: 22222222-2222-2222-2222-222222222001
        - name: search
          in: query
          required: false
          schema:
            type: string
          example: Madagascar
      responses:
        '200':
          description: Paginated list of books
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookPage'
              example:
                content:
                  - id: 44444444-4444-4444-4444-444444444001
                    title: "Nour, 1947"
                    description: "Roman évoquant l'insurrection malgache de 1947."
                    language: FR
                    authors:
                      - id: 22222222-2222-2222-2222-222222222001
                        firstName: Jean-Luc
                        lastName: Raharimanana
                    genres:
                      - id: 33333333-3333-3333-3333-333333333001
                        name: Roman
                      - id: 33333333-3333-3333-3333-333333333004
                        name: Histoire
                    editions:
                      - id: 55555555-5555-5555-5555-555555555001
                        isbn: "978-2-84487-000-1"
                        format: PAPERBACK
                        sellingPrice: 32000
                        publishedDate: "2015-03-10"
                        coverImageUrl: "https://covers.example.com/nour1947.jpg"
                        condition: NEW
                        quantityInStock: 12
                        totalReceived: 20
                        totalSold: 8
                        publisher:
                          id: 11111111-1111-1111-1111-111111111003
                          name: Editions Jeunes Malgaches
                          country: Madagascar
                    reviews:
                      - id: 77777777-7777-7777-7777-777777777001
                        rating: 5
                        comment: "Un roman bouleversant sur l'histoire de Madagascar, à lire absolument."
                        createdAt: "2025-02-14T10:30:00Z"
                        userId: 99999999-9999-9999-9999-999999999001
                totalElements: 10
                totalPages: 1
                number: 0
                size: 20
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'

    post:
      tags: [Books]
      summary: Create a new book
      operationId: createBook
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookCreateRequest'
            example:
              title: "Au-delà des rizières"
              description: "Fresque historique sur Madagascar au XIXe siècle."
              language: FR
              authorIds:
                - 22222222-2222-2222-2222-222222222005
              genreIds:
                - 33333333-3333-3333-3333-333333333001
                - 33333333-3333-3333-3333-333333333004
      responses:
        '201':
          description: Book created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookResponse'
              example:
                id: 44444444-4444-4444-4444-444444444005
                title: "Au-delà des rizières"
                description: "Fresque historique sur Madagascar au XIXe siècle."
                language: FR
                authors:
                  - id: 22222222-2222-2222-2222-222222222005
                    firstName: Naivo
                    lastName: ""
                genres:
                  - id: 33333333-3333-3333-3333-333333333001
                    name: Roman
                  - id: 33333333-3333-3333-3333-333333333004
                    name: Histoire
                editions: []
                reviews: []
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /books/{bookId}:
    parameters:
      - $ref: '#/components/parameters/BookIdPath'

    get:
      tags: [Books]
      summary: Get a book by ID
      operationId: getBookById
      responses:
        '200':
          description: Book found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookResponse'
              example:
                id: 44444444-4444-4444-4444-444444444003
                title: "Le Petit Prince"
                description: "Conte poétique et philosophique sous forme d'une fable."
                language: FR
                authors:
                  - id: 22222222-2222-2222-2222-222222222003
                    firstName: Antoine
                    lastName: "de Saint-Exupéry"
                genres:
                  - id: 33333333-3333-3333-3333-333333333003
                    name: Jeunesse
                editions:
                  - id: 55555555-5555-5555-5555-555555555003
                    isbn: "978-2-07-040850-4"
                    format: POCKET
                    sellingPrice: 15000
                    publishedDate: "1999-04-01"
                    coverImageUrl: "https://covers.example.com/petitprince.jpg"
                    condition: NEW
                    quantityInStock: 25
                    totalReceived: 40
                    totalSold: 15
                    publisher:
                      id: 11111111-1111-1111-1111-111111111001
                      name: Gallimard
                      country: France
                reviews:
                  - id: 77777777-7777-7777-7777-777777777003
                    rating: 5
                    comment: "Un classique intemporel, parfait pour petits et grands."
                    createdAt: "2025-01-20T09:00:00Z"
                    userId: 99999999-9999-9999-9999-999999999003
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

    put:
      tags: [Books]
      summary: Replace a book entirely
      operationId: updateBook
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookUpdateRequest'
            example:
              title: "Le Petit Prince"
              description: "Conte poétique et philosophique, édition révisée."
              language: FR
              authorIds:
                - 22222222-2222-2222-2222-222222222003
              genreIds:
                - 33333333-3333-3333-3333-333333333003
      responses:
        '200':
          description: Book updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

    patch:
      tags: [Books]
      summary: Partially update a book
      operationId: patchBook
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookPatchRequest'
            example:
              description: "Nouvelle description mise à jour."
      responses:
        '200':
          description: Book patched
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

    delete:
      tags: [Books]
      summary: Delete a book
      operationId: deleteBook
      responses:
        '204':
          description: Book deleted
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /books/{bookId}/editions:
    parameters:
      - $ref: '#/components/parameters/BookIdPath'

    get:
      tags: [BookEditions]
      summary: List all editions of a book
      operationId: getEditionsByBook
      responses:
        '200':
          description: List of editions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BookEditionResponse'
              example:
                - id: 55555555-5555-5555-5555-555555555006
                  isbn: "978-2-07-054127-8"
                  format: HARDCOVER
                  sellingPrice: 55000
                  publishedDate: "1997-06-26"
                  coverImageUrl: "https://covers.example.com/hp1.jpg"
                  condition: NEW
                  quantityInStock: 18
                  totalReceived: 30
                  totalSold: 12
                  publisher:
                    id: 11111111-1111-1111-1111-111111111005
                    name: Penguin Random House
                    country: Etats-Unis
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

    post:
      tags: [BookEditions]
      summary: Add an edition to a book
      operationId: addEdition
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookEditionCreateRequest'
            example:
              isbn: "978-2-07-054129-2"
              format: HARDCOVER
              sellingPrice: 55000
              publishedDate: "1998-07-02"
              coverImageUrl: "https://covers.example.com/hp2.jpg"
              condition: NEW
              quantityInStock: 10
              publisherId: 11111111-1111-1111-1111-111111111005
      responses:
        '201':
          description: Edition created (PriceHistory recorded)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookEditionResponse'
              example:
                id: 55555555-5555-5555-5555-555555555009
                isbn: "978-2-07-054129-2"
                format: HARDCOVER
                sellingPrice: 55000
                publishedDate: "1998-07-02"
                coverImageUrl: "https://covers.example.com/hp2.jpg"
                condition: NEW
                quantityInStock: 10
                totalReceived: 10
                totalSold: 0
                publisher:
                  id: 11111111-1111-1111-1111-111111111005
                  name: Penguin Random House
                  country: Etats-Unis
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /books/{bookId}/editions/{editionId}:
    parameters:
      - $ref: '#/components/parameters/BookIdPath'
      - $ref: '#/components/parameters/EditionIdPath'

    put:
      tags: [BookEditions]
      summary: Update an edition (creates PriceHistory on price change)
      operationId: updateEdition
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookEditionCreateRequest'
            example:
              isbn: "978-2-07-054127-8"
              format: HARDCOVER
              sellingPrice: 58000
              publishedDate: "1997-06-26"
              coverImageUrl: "https://covers.example.com/hp1.jpg"
              condition: NEW
              quantityInStock: 18
              publisherId: 11111111-1111-1111-1111-111111111005
      responses:
        '200':
          description: Edition updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookEditionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

    delete:
      tags: [BookEditions]
      summary: Delete an edition
      operationId: deleteEdition
      responses:
        '204':
          description: Edition deleted
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /books/{bookId}/editions/{editionId}/stock:
    parameters:
      - $ref: '#/components/parameters/BookIdPath'
      - $ref: '#/components/parameters/EditionIdPath'

    get:
      tags: [Stock]
      summary: Get stock for a specific edition
      operationId: getEditionStock
      responses:
        '200':
          description: Stock info
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StockResponse'
              example:
                editionId: 55555555-5555-5555-5555-555555555001
                isbn: "978-2-84487-000-1"
                quantityInStock: 12
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

    patch:
      tags: [Stock]
      summary: Manually set stock quantity for an edition
      operationId: updateEditionStock
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: integer
            example: 15
      responses:
        '200':
          description: Stock updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StockResponse'
              example:
                editionId: 55555555-5555-5555-5555-555555555001
                isbn: "978-2-84487-000-1"
                quantityInStock: 15
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /books/{bookId}/stock:
    parameters:
      - $ref: '#/components/parameters/BookIdPath'

    get:
      tags: [Stock]
      summary: Get total stock across all editions of a book
      operationId: getTotalBookStock
      responses:
        '200':
          description: Total quantity in stock
          content:
            application/json:
              schema:
                type: integer
              example: 12
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /books/{bookId}/reviews:
    parameters:
      - $ref: '#/components/parameters/BookIdPath'

    get:
      tags: [Reviews]
      summary: List all reviews for a book
      operationId: getReviewsByBook
      responses:
        '200':
          description: List of reviews
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ReviewResponse'
              example:
                - id: 77777777-7777-7777-7777-777777777001
                  rating: 5
                  comment: "Un roman bouleversant sur l'histoire de Madagascar, à lire absolument."
                  createdAt: "2025-02-14T10:30:00Z"
                  userId: 99999999-9999-9999-9999-999999999001
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

    post:
      tags: [Reviews]
      summary: Add a review to a book
      operationId: addReview
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewCreateRequest'
            example:
              rating: 5
              comment: "Chef-d'oeuvre de la littérature française."
              userId: 99999999-9999-9999-9999-999999999001
      responses:
        '201':
          description: Review created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewResponse'
              example:
                id: 77777777-7777-7777-7777-777777777004
                rating: 5
                comment: "Chef-d'oeuvre de la littérature française."
                createdAt: "2025-04-11T18:45:00Z"
                userId: 99999999-9999-9999-9999-999999999001
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /books/{bookId}/reviews/{reviewId}:
    parameters:
      - $ref: '#/components/parameters/BookIdPath'
      - name: reviewId
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Review UUID
        example: 77777777-7777-7777-7777-777777777001

    delete:
      tags: [Reviews]
      summary: Delete a review
      operationId: deleteReview
      responses:
        '204':
          description: Review deleted
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /authors:
    get:
      tags: [Authors]
      summary: List all authors (paginated, searchable)
      operationId: getAllAuthors
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
        - name: name
          in: query
          required: false
          schema:
            type: string
          description: Search by first or last name
          example: Rakotoson
      responses:
        '200':
          description: Paginated list of authors
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorPage'
              example:
                content:
                  - id: 22222222-2222-2222-2222-222222222002
                    firstName: Michèle
                    lastName: Rakotoson
                    bio: "Romancière et dramaturge malgache installée en France."
                totalElements: 8
                totalPages: 1
                number: 0
                size: 20
        '500':
          $ref: '#/components/responses/InternalServerError'

    post:
      tags: [Authors]
      summary: Create a new author
      operationId: createAuthor
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthorCreateRequest'
            example:
              firstName: Amin
              lastName: Maalouf
              bio: "Ecrivain franco-libanais, membre de l'Académie française."
      responses:
        '201':
          description: Author created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorResponse'
              example:
                id: 22222222-2222-2222-2222-222222222008
                firstName: Amin
                lastName: Maalouf
                bio: "Ecrivain franco-libanais, membre de l'Académie française."
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /authors/{authorId}:
    parameters:
      - name: authorId
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Author UUID
        example: 22222222-2222-2222-2222-222222222001

    get:
      tags: [Authors]
      summary: Get an author by ID
      operationId: getAuthorById
      responses:
        '200':
          description: Author found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorResponse'
              example:
                id: 22222222-2222-2222-2222-222222222001
                firstName: Jean-Luc
                lastName: Raharimanana
                bio: "Ecrivain malgache, auteur de romans et nouvelles explorant l'histoire de Madagascar."
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

    put:
      tags: [Authors]
      summary: Update an author
      operationId: updateAuthor
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthorUpdateRequest'
            example:
              firstName: Jean-Luc
              lastName: Raharimanana
              bio: "Ecrivain et poète malgache, figure majeure de la littérature contemporaine."
      responses:
        '200':
          description: Author updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

    delete:
      tags: [Authors]
      summary: Delete an author
      operationId: deleteAuthor
      responses:
        '204':
          description: Author deleted
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /genres:
    get:
      tags: [Genres]
      summary: List all genres
      operationId: getAllGenres
      responses:
        '200':
          description: List of genres
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GenreResponse'
              example:
                - id: 33333333-3333-3333-3333-333333333001
                  name: Roman
                - id: 33333333-3333-3333-3333-333333333003
                  name: Jeunesse
                - id: 33333333-3333-3333-3333-333333333004
                  name: Histoire
        '500':
          $ref: '#/components/responses/InternalServerError'

    post:
      tags: [Genres]
      summary: Create a new genre
      operationId: createGenre
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenreCreateRequest'
            example:
              name: Fantastique
      responses:
        '201':
          description: Genre created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenreResponse'
              example:
                id: 33333333-3333-3333-3333-333333333006
                name: Fantastique
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /genres/{genreId}:
    parameters:
      - name: genreId
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Genre UUID
        example: 33333333-3333-3333-3333-333333333001

    get:
      tags: [Genres]
      summary: Get a genre by ID
      operationId: getGenreById
      responses:
        '200':
          description: Genre found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenreResponse'
              example:
                id: 33333333-3333-3333-3333-333333333001
                name: Roman
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

    delete:
      tags: [Genres]
      summary: Delete a genre
      operationId: deleteGenre
      responses:
        '204':
          description: Genre deleted
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /revenue/genres:
    get:
      tags: [Revenue]
      summary: Total revenue grouped by genre
      operationId: getRevenueByGenre
      responses:
        '200':
          description: Revenue per genre
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GenreRevenueResponse'
              example:
                - genreId: 33333333-3333-3333-3333-333333333006
                  genreName: Fantastique
                  totalRevenue: 55000
                  saleCount: 1
                - genreId: 33333333-3333-3333-3333-333333333001
                  genreName: Roman
                  totalRevenue: 82000
                  saleCount: 3
        '500':
          $ref: '#/components/responses/InternalServerError'

  /revenue/genres/{genreId}:
    parameters:
      - name: genreId
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Genre UUID
        example: 33333333-3333-3333-3333-333333333006

    get:
      tags: [Revenue]
      summary: Total revenue for a single genre
      operationId: getRevenueByGenreId
      responses:
        '200':
          description: Revenue for the genre
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenreRevenueResponse'
              example:
                genreId: 33333333-3333-3333-3333-333333333006
                genreName: Fantastique
                totalRevenue: 55000
                saleCount: 1
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /publishers:
    get:
      tags: [Publishers]
      summary: List all publishers
      operationId: getAllPublishers
      responses:
        '200':
          description: List of publishers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PublisherResponse'
              example:
                - id: 11111111-1111-1111-1111-111111111001
                  name: Gallimard
                  country: France
                - id: 11111111-1111-1111-1111-111111111003
                  name: Editions Jeunes Malgaches
                  country: Madagascar
        '500':
          $ref: '#/components/responses/InternalServerError'

    post:
      tags: [Publishers]
      summary: Create a new publisher
      operationId: createPublisher
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublisherCreateRequest'
            example:
              name: Foi et Justice
              country: Madagascar
      responses:
        '201':
          description: Publisher created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublisherResponse'
              example:
                id: 11111111-1111-1111-1111-111111111004
                name: Foi et Justice
                country: Madagascar
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /publishers/{publisherId}:
    parameters:
      - name: publisherId
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Publisher UUID
        example: 11111111-1111-1111-1111-111111111003

    get:
      tags: [Publishers]
      summary: Get a publisher by ID
      operationId: getPublisherById
      responses:
        '200':
          description: Publisher found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublisherResponse'
              example:
                id: 11111111-1111-1111-1111-111111111003
                name: Editions Jeunes Malgaches
                country: Madagascar
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

    delete:
      tags: [Publishers]
      summary: Delete a publisher
      operationId: deletePublisher
      responses:
        '204':
          description: Publisher deleted
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /arrivals:
    post:
      tags: [Arrivals]
      summary: Create an arrival (stock-in)
      operationId: createArrival
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArrivalRequest'
            example:
              arrivalDate: "2025-07-01"
              notes: "Nouveaux titres auteurs malgaches."
              items:
                - editionId: 55555555-5555-5555-5555-555555555001
                  quantity: 10
                  unitCost: 22000
                  condition: NEW
                - editionId: 55555555-5555-5555-5555-555555555005
                  quantity: 9
                  unitCost: 21000
                  condition: NEW
      responses:
        '201':
          description: Arrival recorded, stock incremented
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArrivalResponse'
              example:
                id: 88888888-8888-8888-8888-888888888003
                arrivalDate: "2025-07-01"
                notes: "Nouveaux titres auteurs malgaches."
                totalCost: 409000
                items:
                  - id: 99999999-8888-8888-8888-888888888005
                    quantity: 10
                    unitCost: 22000
                    lineTotal: 220000
                    condition: NEW
                    editionId: 55555555-5555-5555-5555-555555555001
                    editionIsbn: "978-2-84487-000-1"
                  - id: 99999999-8888-8888-8888-888888888006
                    quantity: 9
                    unitCost: 21000
                    lineTotal: 189000
                    condition: NEW
                    editionId: 55555555-5555-5555-5555-555555555005
                    editionIsbn: "978-2-7096-0000-5"
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /sales:
    post:
      tags: [Sales]
      summary: Create a sale (stock-out)
      operationId: createSale
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaleRequest'
            example:
              userId: 99999999-9999-9999-9999-999999999001
              email: hei.irina.4@gmail.com
              paymentMethod: MOBILE_MONEY
              items:
                - editionId: 55555555-5555-5555-5555-555555555006
                  quantity: 1
      responses:
        '201':
          description: Sale recorded, stock decremented
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SaleResponse'
              example:
                id: aaaaaaaa-1111-1111-1111-111111111001
                saleDate: "2025-06-15T11:00:00"
                totalAmount: 55000
                paymentMethod: MOBILE_MONEY
                status: CONFIRMED
                userId: 99999999-9999-9999-9999-999999999001
                items:
                  - id: bbbbbbbb-1111-1111-1111-111111111001
                    quantity: 1
                    unitPrice: 55000
                    lineTotal: 55000
                    editionId: 55555555-5555-5555-5555-555555555006
                    editionIsbn: "978-2-07-054127-8"
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

components:

  parameters:
    BookIdPath:
      name: bookId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Book UUID
      example: 44444444-4444-4444-4444-444444444001

    EditionIdPath:
      name: editionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Edition UUID
      example: 55555555-5555-5555-5555-555555555001

    PageParam:
      name: page
      in: query
      required: false
      schema:
        type: integer
        default: 0
        minimum: 0
      description: Zero-based page index
      example: 0

    SizeParam:
      name: size
      in: query
      required: false
      schema:
        type: integer
        default: 20
        minimum: 1
        maximum: 100
      description: Number of items per page
      example: 20

  responses:
    BadRequest:
      description: Invalid request payload or parameters
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            timestamp: "2025-07-08T10:15:30Z"
            status: 400
            error: Bad Request
            message: "title is mandatory"
            path: /books

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            timestamp: "2025-07-08T10:15:30Z"
            status: 404
            error: Not Found
            message: "Book with id 44444444-4444-4444-4444-444444444099 was not found"
            path: /books/44444444-4444-4444-4444-444444444099

    Conflict:
      description: Resource already exists or stock insufficient
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            timestamp: "2025-07-08T10:15:30Z"
            status: 409
            error: Conflict
            message: "Only 2 in stock for edition 55555555-5555-5555-5555-555555555008"
            path: /sales

    InternalServerError:
      description: Unexpected server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            timestamp: "2025-07-08T10:15:30Z"
            status: 500
            error: Internal Server Error
            message: "Unexpected error occurred"
            path: /books

  schemas:
    Language:
      type: string
      enum: [FR, EN, MG, ES, DE, AR, ZH]
      example: FR

    BookFormat:
      type: string
      enum: [HARDCOVER, PAPERBACK, POCKET, DIGITAL]
      example: PAPERBACK

    BookCondition:
      type: string
      enum: [NEW, USED_GOOD, USED_FAIR]
      example: NEW

    PaymentMethod:
      type: string
      enum: [CASH, MOBILE_MONEY, CARD, TRANSFER]
      example: MOBILE_MONEY

    SaleStatus:
      type: string
      enum: [PENDING, CONFIRMED, CANCELLED]
      example: CONFIRMED

    AuthorSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        firstName:
          type: string
        lastName:
          type: string
      example:
        id: 22222222-2222-2222-2222-222222222001
        firstName: Jean-Luc
        lastName: Raharimanana

    AuthorCreateRequest:
      type: object
      required: [firstName, lastName]
      properties:
        firstName:
          type: string
          maxLength: 100
        lastName:
          type: string
          maxLength: 100
        bio:
          type: string
          maxLength: 2000
      example:
        firstName: Amin
        lastName: Maalouf
        bio: "Ecrivain franco-libanais, membre de l'Académie française."

    AuthorUpdateRequest:
      type: object
      properties:
        firstName:
          type: string
          maxLength: 100
        lastName:
          type: string
          maxLength: 100
        bio:
          type: string
          maxLength: 2000
      example:
        firstName: Jean-Luc
        lastName: Raharimanana
        bio: "Ecrivain et poète malgache, figure majeure de la littérature contemporaine."

    AuthorResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        firstName:
          type: string
        lastName:
          type: string
        bio:
          type: string
      example:
        id: 22222222-2222-2222-2222-222222222001
        firstName: Jean-Luc
        lastName: Raharimanana
        bio: "Ecrivain malgache, auteur de romans et nouvelles explorant l'histoire de Madagascar."

    AuthorPage:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/AuthorResponse'
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
        number:
          type: integer
        size:
          type: integer

    GenreSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
      example:
        id: 33333333-3333-3333-3333-333333333001
        name: Roman

    GenreCreateRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          maxLength: 100
      example:
        name: Fantastique

    GenreRevenueResponse:
      type: object
      properties:
        genreId:
          type: string
          format: uuid
          readOnly: true
        genreName:
          type: string
        totalRevenue:
          type: number
          format: double
          readOnly: true
        saleCount:
          type: integer
          format: int64
          readOnly: true
      example:
        genreId: 33333333-3333-3333-3333-333333333001
        genreName: Roman
        totalRevenue: 82000
        saleCount: 3

    GenreResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
      example:
        id: 33333333-3333-3333-3333-333333333001
        name: Roman

    PublisherSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
        country:
          type: string
      example:
        id: 11111111-1111-1111-1111-111111111003
        name: Editions Jeunes Malgaches
        country: Madagascar

    PublisherCreateRequest:
      type: object
      required: [name]
